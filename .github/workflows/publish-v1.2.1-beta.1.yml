name: Publish v1.2.1-beta.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/release-v1.2.1-beta.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test session renewal in both browser clients
        run: |
          JDVG_CLIENT_PATH=../firefox/lib/myjdownloader.js node tests/myjdownloader-session.test.js
          JDVG_CLIENT_PATH=../chromium/lib/myjdownloader.js node tests/myjdownloader-session.test.js
          JDVG_CONTENT_PATH=firefox/content/content.js node tests/overlay-position.test.js
          JDVG_CONTENT_PATH=chromium/content/content.js node tests/overlay-position.test.js

      - name: Package beta builds
        run: |
          (cd firefox && zip -qr ../jd-video-grabber-firefox-server-access-1.2.1-beta.1.zip .)
          cp jd-video-grabber-firefox-server-access-1.2.1-beta.1.zip \
            jd-video-grabber-firefox-server-access-1.2.1-beta.1-UNSIGNED.xpi
          (cd chromium && zip -qr ../jd-video-grabber-chrome-brave-server-access-1.2.1-beta.1.zip .)
          sha256sum \
            jd-video-grabber-firefox-server-access-1.2.1-beta.1.zip \
            jd-video-grabber-firefox-server-access-1.2.1-beta.1-UNSIGNED.xpi \
            jd-video-grabber-chrome-brave-server-access-1.2.1-beta.1.zip \
            > SHA256SUMS.txt

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.1-beta.1 >/dev/null 2>&1; then
            gh release edit v1.2.1-beta.1 \
              --title "JD Video Grabber v1.2.1-beta.1 — MyJDownloader Session Renewal" \
              --notes-file RELEASE_NOTES_1.2.1-beta.1.md \
              --prerelease
            gh release upload v1.2.1-beta.1 \
              jd-video-grabber-firefox-server-access-1.2.1-beta.1.zip \
              jd-video-grabber-firefox-server-access-1.2.1-beta.1-UNSIGNED.xpi \
              jd-video-grabber-chrome-brave-server-access-1.2.1-beta.1.zip \
              SHA256SUMS.txt \
              --clobber
          else
            gh release create v1.2.1-beta.1 \
              jd-video-grabber-firefox-server-access-1.2.1-beta.1.zip \
              jd-video-grabber-firefox-server-access-1.2.1-beta.1-UNSIGNED.xpi \
              jd-video-grabber-chrome-brave-server-access-1.2.1-beta.1.zip \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "JD Video Grabber v1.2.1-beta.1 — MyJDownloader Session Renewal" \
              --notes-file RELEASE_NOTES_1.2.1-beta.1.md \
              --prerelease
          fi
